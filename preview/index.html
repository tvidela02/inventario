<style>
@font-face {
  font-family: "Figtree"; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url(fonts/figtree-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  --marca: #26532B;        /* Dark Spruce: encabezado */
  --marca-2: #1F7A4D;      /* verde profundo: botones principales */
  --verde: #399E5A;        /* Shamrock */
  --azul: #3E78B2;         /* Rich Cerulean */
  --oro: #B08E1E;
  --rojo: #C0392B;
  --fondo: #EEF2EE;
  --superficie: #FFFFFF;
  --superficie-2: #F5F8F5;
  --texto: #1B241D;
  --texto-2: #5B6B5F;
  --borde: #DDE5DE;
  --icono: #1F7A4D;
  --sombra: 0 10px 30px rgba(38, 83, 43, .10), 0 2px 6px rgba(0, 0, 0, .05);
  --ok-fondo: #E4F3E8; --ok-texto: #1E6B3A;
  --err-fondo: #FBE7E4; --err-texto: #9B2A1F;
  --info-fondo: #E6EEF7; --info-texto: #24548A;
  --aten-fondo: #FBF1D6; --aten-texto: #7A5D08;
  --btn-dev: #8C6D0F;
  --estrella: #C99A06;
  --estrella-vacia: #CFD6D0;
  --brillo: rgba(255, 255, 255, .6);
  --telon: rgba(13, 21, 16, .45);
  color-scheme: light;
}
[data-theme="dark"] {
  --fondo: #0D1510;
  --superficie: #16231A;
  --superficie-2: #1C2C21;
  --texto: #E4EEE6;
  --texto-2: #9DB1A3;
  --borde: #2A3D30;
  --icono: #7BD497;
  --sombra: 0 10px 30px rgba(0, 0, 0, .45);
  --ok-fondo: #173524; --ok-texto: #8FDCA8;
  --err-fondo: #3A1C18; --err-texto: #F3A79C;
  --info-fondo: #182A3D; --info-texto: #9CC3EC;
  --aten-fondo: #352B10; --aten-texto: #E8C766;
  --btn-dev: #A07C12;
  --estrella: #E8B923;
  --estrella-vacia: #3A4A3F;
  --brillo: rgba(255, 255, 255, .06);
  --telon: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fondo); color: var(--texto); min-height: 100vh;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
}
/* Respaldo sin View Transitions: fundido de colores */
html.fundido, html.fundido * { transition: background-color .4s ease, color .4s ease, border-color .4s ease !important; }

/* Íconos (Lucide, SVG en línea) */
.ic { width: 1em; height: 1em; display: inline-block; vertical-align: -.14em; flex: none; }

/* ===== Encabezado ===== */
header {
  background: linear-gradient(135deg, #26532B 0%, #1F6B3C 60%, #2E8A4E 100%);
  color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 46px; position: relative; overflow: hidden;
}
header::after { /* aro decorativo */
  content: ""; position: absolute; right: -40px; top: -50px; width: 180px; height: 180px; border-radius: 50%;
  border: 26px solid rgba(255, 255, 255, .07);
}
.barra { max-width: 520px; margin: auto; display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
.marca-ico {
  width: 42px; height: 42px; border-radius: 12px; background: rgba(255, 255, 255, .14);
  display: grid; place-items: center; font-size: 22px; flex: none;
}
.marca-txt { flex: 1; min-width: 0; }
.marca-txt b { display: block; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.marca-txt span { display: block; font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tema {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25);
  background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; position: relative; flex: none;
  display: grid; place-items: center; -webkit-tap-highlight-color: transparent; font-size: 22px;
}
.tema:active { transform: scale(.92); }
.tema .ic { position: absolute; transition: transform .5s cubic-bezier(.5, -.4, .3, 1.4), opacity .3s; }
.tema .sol { opacity: 1; transform: rotate(0) scale(1); }
.tema .luna { opacity: 0; transform: rotate(-90deg) scale(.4); }
[data-theme="dark"] .tema .sol { opacity: 0; transform: rotate(90deg) scale(.4); }
[data-theme="dark"] .tema .luna { opacity: 1; transform: rotate(0) scale(1); }

/* ===== Tarjeta ===== */
main { flex: 1; padding: 0 14px; margin-top: -32px; position: relative; z-index: 2; }
.card {
  background: var(--superficie); border-radius: 18px; padding: 20px; max-width: 520px; margin: auto;
  box-shadow: var(--sombra); border: 1px solid var(--borde);
}

/* Esqueleto mientras carga (el brillo se mueve con transform: no repinta) */
.esq { border-radius: 10px; background: var(--superficie-2); position: relative; overflow: hidden; margin-bottom: 12px; }
.esq::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--brillo), transparent); animation: brillo 1.3s infinite;
}
@keyframes brillo { to { transform: translateX(100%); } }

/* Cabecera del artículo (la arma decorar()) */
.hero { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.icono {
  width: 64px; height: 64px; border-radius: 18px; flex: none; display: grid; place-items: center; font-size: 32px;
  background: linear-gradient(145deg, var(--ok-fondo), var(--superficie-2)); border: 1px solid var(--borde); color: var(--icono);
}
.hero-txt { min-width: 0; }
.meta { color: var(--texto-2); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill-id { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 999px; padding: 2px 9px; font-weight: 700; font-variant-numeric: tabular-nums; }
h1 { font-size: 23px; line-height: 1.2; margin: 4px 0 0; font-weight: 800; letter-spacing: -.2px; }
h2 { font-size: 16px; margin: 20px 0 4px; font-weight: 700; }
.id { color: var(--texto-2); font-size: 14px; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip-ok { background: var(--ok-fondo); color: var(--ok-texto); }
.chip-uso { background: var(--info-fondo); color: var(--info-texto); }
.chip-uso::before { animation: latido 1.8s ease-out infinite; }
@keyframes latido { 0% { box-shadow: 0 0 0 0 currentColor; } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
.chip-mant { background: var(--aten-fondo); color: var(--aten-texto); }
.chip-crit { background: var(--err-fondo); color: var(--err-texto); }
.chip-neutro { background: var(--superficie-2); color: var(--texto-2); }
.estrellas { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
.estrellas span { display: inline-block; }
.estrellas .llena { color: var(--estrella); }
.estrellas .vacia { color: var(--estrella-vacia); }

/* Datos */
table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
tr.oculta { display: none; }
th { text-align: left; color: var(--texto-2); font-weight: 500; padding: 11px 8px 11px 0; width: 42%; vertical-align: top; font-size: 14px; }
td { padding: 11px 0; border-bottom: 1px solid var(--borde); }
tr:last-child td { border-bottom: 0; }
th .ic { color: var(--icono); margin-right: 6px; font-size: 16px; }
.rel { display: block; color: var(--texto-2); font-size: 13px; margin-top: 2px; }

/* Botones */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center;
  background: var(--marca-2); color: #fff; text-decoration: none;
  padding: 15px; border: 0; border-radius: 12px; margin-top: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: inherit; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); transition: transform .12s, filter .2s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); filter: brightness(.94); }
.sec { background: var(--superficie-2); color: var(--texto); border: 1px solid var(--borde); box-shadow: none; }
.sec .ic { color: var(--icono); }
.usar { background: var(--marca-2); }
.dev { background: var(--btn-dev); }
button:disabled { opacity: .55; cursor: wait; }
a { color: var(--azul); }
[data-theme="dark"] a { color: #8DB8E6; }

/* Mensajes y estados */
.ok, .err, .info { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 15px; display: flex; gap: 8px; align-items: flex-start; }
.ok .ic, .err .ic, .info .ic { margin-top: .12em; }
.ok { background: var(--ok-fondo); color: var(--ok-texto); }
.err { background: var(--err-fondo); color: var(--err-texto); }
.info { background: var(--info-fondo); color: var(--info-texto); }
.herr, .adm { border-top: 1px solid var(--borde); padding-top: 14px; margin-top: 14px; }
.estado { padding: 13px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 16px; display: flex; gap: 9px; align-items: flex-start; flex-wrap: wrap; }
.estado > .ic { margin-top: .15em; font-size: 18px; }
.libre { background: var(--ok-fondo); color: var(--ok-texto); }
.uso { background: var(--aten-fondo); color: var(--aten-texto); }
.mant { background: var(--err-fondo); color: var(--err-texto); }
.estado > span, .ok > span, .err > span, .info > span, .quien > span { flex: 1; min-width: 0; }
.contador { flex-basis: 100%; display: flex; align-items: baseline; gap: 8px; margin-top: 6px; font-size: 13px; }
.contador b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; }

/* Formularios */
label { display: block; color: var(--texto-2); margin: 12px 0 6px; font-size: 14px; }
select, input, textarea {
  width: 100%; font-size: 16px; padding: 12px; border: 1px solid var(--borde); border-radius: 10px;
  background: var(--superficie-2); color: var(--texto); font-family: inherit;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--verde); outline-offset: 1px; }
.quien { color: var(--texto-2); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.nota { color: var(--texto-2); font-size: 14px; margin-top: 8px; }
.oculto { display: none; }

/* Sin señal */
.franja {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
  background: var(--aten-fondo); color: var(--aten-texto); font-size: 14px;
}
.franja .ic { font-size: 20px; }

/* Mensaje sin tarjeta (no encontrado, sin conexión) */
.vacio { text-align: center; padding: 10px 0 4px; }
.vacio .grande {
  width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 26px; display: grid; place-items: center; font-size: 42px;
  background: var(--superficie-2); color: var(--icono); border: 1px solid var(--borde);
}

/* ===== PIN en ventana que sube desde abajo ===== */
dialog.hoja {
  margin: auto auto 0; width: 100%; max-width: 520px; max-height: 90vh; border: 0; border-radius: 22px 22px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom)); background: var(--superficie); color: var(--texto);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); transform: translateY(0); opacity: 1;
  transition: transform .34s cubic-bezier(.2, .8, .2, 1), opacity .2s, overlay .34s allow-discrete, display .34s allow-discrete;
}
dialog.hoja:not([open]) { transform: translateY(100%); opacity: 0; }
@starting-style { dialog.hoja[open] { transform: translateY(100%); opacity: 0; } }
dialog.hoja::backdrop { background: var(--telon); transition: background-color .3s, overlay .3s allow-discrete, display .3s allow-discrete; }
@starting-style { dialog.hoja[open]::backdrop { background: transparent; } }
.asa { width: 42px; height: 5px; border-radius: 3px; background: var(--borde); margin: 2px auto 12px; }
.hoja-cab { display: flex; align-items: center; gap: 12px; }
.hoja-cab h2 { margin: 0; flex: 1; font-size: 19px; }
.candado {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
  background: var(--ok-fondo); color: var(--icono); flex: none;
}
.cerrar {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--borde); background: var(--superficie-2);
  color: var(--texto-2); font-size: 22px; line-height: 1; cursor: pointer; flex: none;
}
#dlg-msg:empty { display: none; }
#dlg-msg { margin-top: 12px; }

/* ===== Festejo (verificado / devuelta / empezó a usar) ===== */
.festejo { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 50; }
.sello {
  width: 124px; height: 124px; border-radius: 50%; background: var(--marca-2); display: grid; place-items: center;
  box-shadow: 0 0 0 10px rgba(57, 158, 90, .18), 0 16px 40px rgba(31, 122, 77, .45);
}
.sello svg { width: 66px; height: 66px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }

/* ===== Pie ===== */
footer { text-align: center; padding: 26px 16px calc(22px + env(safe-area-inset-bottom)); color: var(--texto-2); font-size: 12px; }
footer img { height: 84px; display: block; margin: 0 auto 8px; }
.logo-oscuro { display: none !important; }
[data-theme="dark"] .logo-claro { display: none !important; }
[data-theme="dark"] .logo-oscuro { display: block !important; }

/* View Transitions: el cambio de tema crece en círculo desde el botón (solo con html.vt-tema);
   en las acciones, la etiqueta de estado se transforma de un valor al otro. */
html.vt-tema::view-transition-old(root), html.vt-tema::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
::view-transition-group(*) { animation-duration: .3s; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<header>
  <div class="barra">
    <div class="marca-ico" id="marca-ico" aria-hidden="true"></div>
    <div class="marca-txt">
      <b id="marca-nombre">Olivos Patagónicos</b>
      <span id="marca-sitio">Inventario · Polo Olivícola Dolavon</span>

    <button class="tema" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro" onclick="cambiarTema()"></button>

<main>

    <div class="hero"><div class="esq" style="width:64px;height:64px;border-radius:18px;margin:0"></div>
      <div style="flex:1"><div class="esq" style="height:12px;width:40%"></div><div class="esq" style="height:22px;width:75%;margin:0"></div></div></div>

</main>

<footer>
  <img class="logo-claro" src="img/isur_logo_claro.png" alt="iSUR">
  <img class="logo-oscuro" src="img/isur_logo_oscuro.png" alt="iSUR">
  Sistema de inventario por iSUR · inteligencia en red
</footer>

  cargarConfetti().then(function (conf) {
    if (!conf) return;
    var base = { colors: COLORES_MARCA, shapes: formas(conf), scalar: 1.15, disableForReducedMotion: true, zIndex: 60 };
    if (tipo === "grande") {
      conf(Object.assign({}, base, { particleCount: 45, spread: 75, startVelocity: 42, origin: { x: .5, y: .5 } }));
      setTimeout(function () {
        conf(Object.assign({}, base, { particleCount: 18, angle: 60, spread: 55, origin: { x: 0, y: .7 } }));
        conf(Object.assign({}, base, { particleCount: 18, angle: 120, spread: 55, origin: { x: 1, y: .7 } }));
      }, 180);
    } else {
      conf(Object.assign({}, base, { particleCount: 30, spread: 60, startVelocity: 34, origin: { x: .5, y: .5 } }));
    }
  }).catch(function () {});
}
function sacudir(el) {
  animar(el, [{ transform: "translateX(0)" }, { transform: "translateX(-10px)" }, { transform: "translateX(9px)" },
    { transform: "translateX(-7px)" }, { transform: "translateX(5px)" }, { transform: "translateX(-2px)" }, { transform: "translateX(0)" }],
    { duration: 380, easing: "ease-out" });
}

// ===== Sin señal: última ficha guardada en el celular =====
var modoSinSenal = false;
function guardarFicha(res) {
  if (!ID_ART || !res.html) return;
  ls(CLAVE_FICHA + ID_ART, JSON.stringify({ html: res.html, titulo: res.titulo || "", t: Date.now() }));
}
function mostrarSinSenal() {
  var guardada = null;
  try { guardada = JSON.parse(ls(CLAVE_FICHA + ID_ART) || "null"); } catch (e) {}
  if (!guardada || !guardada.html) {
    soloMensaje("Sin conexión", "wifi-off");
    aviso("No se pudo conectar con el inventario. Revisá la señal: se carga sola cuando vuelva.", "err");
  } else {
    if (guardada.titulo) document.title = guardada.titulo + " · Inventario";
    tarjeta().innerHTML = guardada.html; decorar(); entrada();
    var m = document.getElementById("msg"); if (m) m.innerHTML = "";
    botones(false);
    var f = document.createElement("div"); f.className = "franja"; f.setAttribute("role", "status");
    f.innerHTML = svg("wifi-off") + "<div><b>Sin señal.</b> <span></span></div>";
    f.querySelector("span").textContent = "Estás viendo la ficha guardada " + haceRato(Date.now() - guardada.t) +
      ". Los botones vuelven cuando haya señal.";
    tarjeta().insertBefore(f, tarjeta().firstChild);
    animar(f, [{ opacity: 0, transform: "translateY(-8px)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "ease-out" });
  }
  modoSinSenal = true;
}
window.addEventListener("online", function () {
  if (modoSinSenal && ID_ART) { modoSinSenal = false; llamar("escaneo", [ID_ART, ls(CLAVE_T)]); }
});

// ===== Pedidos al servidor =====
function pintar(res, fn) {
  if (res.titulo) document.title = res.titulo + " · Inventario";
  if (res.sesionVencida) ls(CLAVE_T, null);
  if (res.token) ls(CLAVE_T, res.token);
  var r = resultado(res);
  // Lo que va después de dibujar la tarjeta nueva (con View Transition, el dibujo es asíncrono).
  var despues = function () {
    if (res.error) aviso(res.error, "err");
    if (!r.err && r.ok) {
      if (fn === "verificarAdmin") festejar("grande");
      else if (fn === "terminarUso") festejar("chico");
      else if (fn === "empezarUso") festejar("check");
    }
  };
  if (res.html) {
    var aplicar = function () { tarjeta().innerHTML = res.html; decorar(); recordar(); };
    if (fn === "escaneo") { aplicar(); entrada(); despues(); }
    else if (document.startViewTransition && !SIN_ANIMACION) {
      var tr = null;
      try { tr = document.startViewTransition(aplicar); } catch (e) {}
      if (tr) tr.updateCallbackDone.then(despues, function () { aplicar(); despues(); });
      else { aplicar(); despues(); }
    } else { aplicar(); despues(); }
    if (fn === "escaneo" || fn === "ficha") guardarFicha(res);
  } else {
    if (res.titulo) soloMensaje(res.titulo, /no encontrado/i.test(res.titulo) ? "search-x" : "tag");
    else botones(true);
    despues();
  }
  return r;
}
// Texto plano = pedido "simple" (sin preflight CORS). credentials "omit" = sin cookies de Google (sin /u/N/).
function pedir(fn, args) {
  return fetch(API, { method: "POST", body: JSON.stringify({ fn: fn, args: args }), credentials: "omit", redirect: "follow" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
function llamar(fn, args, espera) {
  botones(false);
  if (espera) aviso(espera, "info");
  pedir(fn, args)
    .then(function (res) { modoSinSenal = false; pintar(res, fn); })
    .catch(function () {
      if (fn === "escaneo") { mostrarSinSenal(); return; }
      botones(true);
      aviso("No se pudo conectar con el inventario. Revisá la señal y probá de nuevo.", "err");
    });
}
function valor(id) { return document.getElementById(id).value; }
function usar(accion) {
  var s = document.getElementById("persona");
  if (!s.value) { aviso("Elegí tu nombre primero.", "err"); sacudir(s); return; }
  ls(CLAVE_P, s.value);
  llamar(accion === "empezar" ? "empezarUso" : "terminarUso", [ID_ART, s.value, ls(CLAVE_T)], "Guardando…");
}
function salir() { var t = ls(CLAVE_T); ls(CLAVE_T, null); llamar("salirAdmin", [ID_ART, t]); }
function verificar() { llamar("verificarAdmin", [ID_ART, ls(CLAVE_T)], "Guardando…"); }
function guardar() {
  llamar("guardarCambios", [ID_ART, ls(CLAVE_T), {
    disponibilidad: valor("e-disp"), desgaste: valor("e-desg"), ubicacion: valor("e-ubic"), notas: valor("e-notas")
  }], "Guardando…");
}

// ===== Modo administrativo: PIN en una ventana que sube desde abajo =====
// El servidor manda un formulario oculto (#login) con la lista de administrativos; acá se usa en un <dialog>.
// Sin soporte de <dialog> (navegadores muy viejos) se muestra el formulario original dentro de la tarjeta.
var TIENE_DIALOG = typeof HTMLDialogElement === "function" && typeof HTMLDialogElement.prototype.showModal === "function";
function mostrar(id) {
  if (id === "login" && TIENE_DIALOG && document.getElementById("adm-nombre")) { abrirPin(); return; }
  document.getElementById(id).className = "";
}
function entrar() { llamar("entrarAdmin", [ID_ART, valor("adm-nombre"), valor("adm-pin")], "Verificando PIN…"); }
function dialogoPin() {
  var d = document.getElementById("dlg-pin");
  if (d) return d;
  d = document.createElement("dialog"); d.className = "hoja"; d.id = "dlg-pin"; d.setAttribute("aria-labelledby", "dlg-titulo");
  d.innerHTML = '<div class="asa"></div>' +
    '<div class="hoja-cab"><div class="candado">' + svg("lock") + '</div><h2 id="dlg-titulo">Modo administrativo</h2>' +
    '<button type="button" class="cerrar" aria-label="Cerrar">×</button></div>' +
    '<div id="dlg-msg" role="alert"></div>' +
    '<label for="dlg-nombre">Administrativo</label><select id="dlg-nombre"></select>' +
    '<label for="dlg-pin-in">PIN</label><input id="dlg-pin-in" type="password" inputmode="numeric" autocomplete="off" enterkeyhint="go">' +
    '<button type="button" class="btn" id="dlg-entrar">' + svg("lock-open") + 'Entrar</button>';
  document.body.appendChild(d);
  d.querySelector(".cerrar").onclick = function () { d.close(); };
  d.addEventListener("click", function (e) { // tocar afuera (el fondo oscuro) cierra; el borde interno no
    if (e.target !== d) return;
    var b = d.getBoundingClientRect();
    if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) d.close();
  });
  d.querySelector("#dlg-entrar").onclick = entrarDialogo;
  d.querySelector("#dlg-pin-in").addEventListener("keydown", function (e) { if (e.key === "Enter") entrarDialogo(); });
  return d;
}
function abrirPin() {
  var d = dialogoPin(), sel = d.querySelector("#dlg-nombre"), origen = document.getElementById("adm-nombre");
  sel.innerHTML = "";
  Array.prototype.forEach.call(origen.options, function (o) {
    var op = document.createElement("option"); op.textContent = o.textContent; sel.appendChild(op);
  });
  var ultimo = ls(CLAVE_ADMIN);
  if (ultimo) Array.prototype.forEach.call(sel.options, function (o) { if (o.textContent === ultimo) sel.value = ultimo; });
  d.querySelector("#dlg-msg").innerHTML = "";
  d.querySelector("#dlg-pin-in").value = "";
  d.querySelector(".candado").innerHTML = svg("lock");
  d.showModal();
  setTimeout(function () { d.querySelector("#dlg-pin-in").focus(); }, 60);
}
function errorDialogo(d, texto) {
  var m = d.querySelector("#dlg-msg"); m.innerHTML = "";
  var div = document.createElement("div"); div.className = "err"; div.textContent = texto; m.appendChild(div);
  sacudir(d);
}
function entrarDialogo() {
  var d = document.getElementById("dlg-pin"), btn = d.querySelector("#dlg-entrar");
  var nombre = d.querySelector("#dlg-nombre").value, pin = d.querySelector("#dlg-pin-in").value;
  if (!pin) { errorDialogo(d, "Escribí tu PIN."); return; }
  btn.disabled = true;
  pedir("entrarAdmin", [ID_ART, nombre, pin]).then(function (res) {
    btn.disabled = false;
    if (res.token) {
      ls(CLAVE_ADMIN, nombre);
      var cand = d.querySelector(".candado"); cand.innerHTML = svg("lock-open");
      var a = animar(cand, [{ transform: "scale(1)" }, { transform: "scale(1.25) rotate(-8deg)" }, { transform: "scale(1)" }], { duration: 420, easing: RESORTE });
      var cerrar = function () { d.close(); pintar(res, "entrarAdmin"); var adm = tarjeta().querySelector(".adm"); if (adm) adm.scrollIntoView({ behavior: SIN_ANIMACION ? "auto" : "smooth", block: "nearest" }); };
      if (a) a.onfinish = cerrar; else cerrar();
    } else {
      d.querySelector("#dlg-pin-in").value = "";
      errorDialogo(d, resultado(res).err || "No se pudo entrar.");
    }
  }).catch(function () {
    btn.disabled = false;
    errorDialogo(d, "No se pudo conectar. Revisá la señal y probá de nuevo.");
  });
}

if (ID_ART) llamar("escaneo", [ID_ART, ls(CLAVE_T)]);
else { soloMensaje("Falta el ID", "tag"); aviso("El QR no tiene un ID de artículo.", "err"); }
</script>
</body>
